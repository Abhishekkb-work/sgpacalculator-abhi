
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AbhiSites | Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, rgba(0, 229, 255, 0.20), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(123, 31, 162, 0.25), transparent 30%),
                linear-gradient(135deg, #050816, #0b1026, #111936);

            color: white;
            position: relative;
        }

        /* Background glowing circles */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(10px);
            z-index: 0;
        }

        body::before {
            width: 280px;
            height: 280px;
            background: rgba(0, 229, 255, 0.15);
            top: -80px;
            left: -80px;
            animation: float 7s ease-in-out infinite;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: rgba(168, 85, 247, 0.15);
            bottom: -120px;
            right: -100px;
            animation: float 9s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }
        }

        /* Main Card */
        .card {
            position: relative;
            z-index: 2;

            width: min(90%, 450px);
            padding: 50px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);

            animation: cardAppear 0.8s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */
        .logo {
            width: 90px;
            height: 90px;

            margin: 0 auto 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 25px;

            background: linear-gradient(135deg, #00e5ff, #7c3aed);

            font-size: 35px;
            font-weight: 800;

            box-shadow:
                0 0 30px rgba(0, 229, 255, 0.25);

            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
            }

            50% {
                box-shadow: 0 0 45px rgba(124, 58, 237, 0.45);
            }
        }

        h1 {
            font-size: 38px;
            letter-spacing: -1px;
            margin-bottom: 10px;

            background: linear-gradient(90deg, #ffffff, #7dd3fc, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #b8c1d9;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* Button */
        .visit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            width: 100%;
            padding: 16px 25px;

            border: none;
            border-radius: 14px;

            background: linear-gradient(135deg, #00c6ff, #7c3aed);

            color: white;
            font-size: 16px;
            font-weight: 700;

            text-decoration: none;
            cursor: pointer;

            transition: 0.3s ease;

            box-shadow:
                0 10px 30px rgba(0, 198, 255, 0.18);
        }

        .visit-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 40px rgba(124, 58, 237, 0.35);

            filter: brightness(1.08);
        }

        .visit-btn:active {
            transform: scale(0.98);
        }

        .arrow {
            font-size: 20px;
            transition: 0.3s ease;
        }

        .visit-btn:hover .arrow {
            transform: translateX(5px);
        }

        /* Small status */
        .status {
            margin-top: 25px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;

            font-size: 12px;
            color: #8f9bb7;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;

            box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #6f7a96;
        }

        /* Decorative floating dots */
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            animation: particleFloat 5s infinite ease-in-out;
        }

        .p1 {
            top: 20%;
            left: 15%;
        }

        .p2 {
            top: 70%;
            left: 10%;
            animation-delay: 1s;
        }

        .p3 {
            top: 25%;
            right: 12%;
            animation-delay: 2s;
        }

        .p4 {
            bottom: 18%;
            right: 18%;
            animation-delay: 3s;
        }

        @keyframes particleFloat {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            50% {
                transform: translateY(-20px);
                opacity: 1;
            }
        }

        /* Mobile */
        @media (max-width: 500px) {

            .card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 32px;
            }

            .logo {
                width: 75px;
                height: 75px;
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <!-- Decorative particles -->
    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>

    <main class="card">

        <div class="logo">
            AS
        </div>

        <h1>AbhiSites</h1>

        <p class="subtitle">
            Welcome to AbhiSites.<br>
            Explore my websites, projects, services and more.
        </p>

        <a
            href="https://linktr.ee/abhisites"
            class="visit-btn"
        >
            Visit AbhiSites
            <span class="arrow">→</span>
        </a>

        <div class="status">
            <span class="dot"></span>
            <span>Ready to explore</span>
        </div>

        <div class="footer">
            © 2026 AbhiSites · All Rights Reserved
        </div>

    </main>

</body>
</html>
